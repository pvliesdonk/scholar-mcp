[project.optional-dependencies]
# PROJECT-EXTRAS-START — domain optional-dependency groups; kept across copier update
mcp = ["fastmcp[tasks]>=3.2.0,<4"]
# Pulls debugpy transitively via fastmcp-pvl-core's [debug] extra.  The
# version range is inherited from the [project] dependency on
# fastmcp-pvl-core above; pip resolves a single, consistent version.
debug = ["fastmcp-pvl-core[debug]"]
# ``all`` is the production-features rollup — what a published-package consumer
# installs with ``pip install pvliesdonk-scholar-mcp[all]``.  Debug is opt-in
# separately (``--extra debug`` or, in the Dockerfile, ``--build-arg DEBUG=true``)
# so ``[all]`` images stay lean.  CI uses ``--all-extras`` which picks up both.
all = ["fastmcp[tasks]>=3.2.0,<4"]
# PROJECT-EXTRAS-END

# Tooling lives under PEP 735 [dependency-groups] (not [project.optional-dependencies])
# so it never ships to PyPI consumers and never lands in the security-audit input.
[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "diff-cover>=9.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pip-audit>=2.7",
    "respx>=0.20",
    "jsonschema>=4.18",
]
docs = [
    "mike>=2",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=0.28",
    "mkdocs-llmstxt>=0.5",
]

browser = [
    "pytest-playwright>=0.5",
]

[project.scripts]
scholar-mcp = "scholar_mcp.cli:main"

[project.urls]
Repository = "https://github.com/pvliesdonk/scholar-mcp"
Documentation = "https://pvliesdonk.github.io/scholar-mcp/"
Issues = "https://github.com/pvliesdonk/scholar-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TC", "PTH", "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Depends() and CurrentContext() calls in argument defaults are the standard
# FastMCP dependency injection pattern — B008 is a false positive here.
# Context/FastMCP/Service imports must stay runtime (not TYPE_CHECKING) for
# DI resolution — TC001/TC002/TC003.

# Template-managed: the structural diff-gate adds `S` (security) on the diff
# pass, so the shipped structural-gate test would self-block: its asserts trip
# S101, and its bare-name `git` call trips S607 (a partial executable path —
# the `sys.executable -m ...` calls are NOT flagged). S603 (subprocess use) is
# included defensively: inert in current ruff but emitted by some versions.
# Ignoring all three in tests keeps the gate from self-blocking on its own test
# module; all three are safe in test code. No-op for the base whole-repo select
# (which excludes S). If your project needs its own tests/** ignores, EXTEND
# this list in place — do not add a second "tests/**" key (duplicate TOML key).
# S104 extends the shipped list (extend in place per the note above): the
# CLI bind-resolution tests assert on the literal "0.0.0.0" the systemd
# packaging relies on (#250) — flagging a test's expected value is noise.
"tests/**" = ["S101", "S603", "S607", "S104"]
# The config-surface generator's bootstrap re-execs itself under `uv run`
# (os.execvpe with a `shutil.which`-resolved absolute path — see
# ensure_core_available). S606 flags any no-shell process start for review;
# here the no-shell form is the safer one, and a `# noqa` instead of this
# entry would trip RUF100 on the whole-repo pass, where `S` isn't selected.
"scripts/gen_config_surface.py" = ["S606"]

# PROJECT-RUFF-IGNORES-START — replace, extend, or override the entries below
# for your project's real source/test paths (split _server_apps.py into
# per-domain modules, rename tests, add per-file overrides as needed); kept
# across copier update.
# PLR0913 (too-many-args) is ignored on the DI/wiring modules below: FastMCP
# inflates their arg counts with `Context` + `Depends()` injections, so the
# structural diff-gate would flag every new tool/resource/prompt and make
# `# noqa: PLR0913` routine. It only bites when enable_structural_gate is on
# (PLR0913 isn't in the base select); domain modules keep the check, and
# C901/PLR0912/PLR0915 still catch a genuinely complex tool here.
"src/scholar_mcp/server.py" = ["ARG001", "B008", "TC002"]
"src/scholar_mcp/cli.py" = ["B008", "TC002", "TC003", "PLR0913"]
"src/scholar_mcp/_server_apps.py" = ["TC002", "PLR0913"]
"src/scholar_mcp/_server_deps.py" = ["ARG001", "B008", "TC002", "TC003", "PLR0913"]
"src/scholar_mcp/_cache.py" = ["TC003"]
"src/scholar_mcp/_docling_client.py" = ["TC002"]
"src/scholar_mcp/_rate_limiter.py" = ["TC002", "TC003"]
"src/scholar_mcp/_server_tools.py" = ["ARG001", "B008", "TC001", "TC002", "PLR0913"]
"src/scholar_mcp/_tools_search.py" = ["ARG001", "B008", "TC001", "TC002", "PLR0913"]
"src/scholar_mcp/_tools_graph.py" = ["ARG001", "B008", "TC001", "TC002", "PLR0913"]
"src/scholar_mcp/_tools_recommendations.py" = ["ARG001", "B008", "TC001", "TC002", "PLR0913"]
"src/scholar_mcp/_tools_utility.py" = ["ARG001", "B008", "TC001", "TC002", "PLR0913"]
"src/scholar_mcp/_tools_pdf.py" = ["ARG001", "B008", "TC001", "TC002", "PLR0913"]
"src/scholar_mcp/_tools_tasks.py" = ["ARG001", "B008", "TC001", "TC002", "PLR0913"]
"src/scholar_mcp/_tools_citation.py" = ["ARG001", "B008", "TC001", "TC002", "PLR0913"]
"src/scholar_mcp/_tools_patent.py" = ["ARG001", "B008", "TC001", "TC002", "PLR0913"]
"src/scholar_mcp/_tools_books.py" = ["ARG001", "B008", "TC001", "TC002", "PLR0913"]
"src/scholar_mcp/_tools_standards.py" = ["ARG001", "B008", "TC001", "TC002", "PLR0913"]
"src/scholar_mcp/_book_enrichment.py" = ["TC001"]
"src/scholar_mcp/_task_queue.py" = ["TC003"]
"src/scholar_mcp/_openlibrary_client.py" = ["TC001"]
"src/scholar_mcp/_standards_client.py" = ["TC001", "TC002", "TC003"]
"src/scholar_mcp/_sync_relaton.py" = ["TC001", "TC002", "TC003"]
"src/scholar_mcp/_relaton_live.py" = ["TC001", "TC002", "TC003"]
"src/scholar_mcp/_server_resources.py" = ["B008", "TC001", "TC002", "PLR0913"]
"src/scholar_mcp/_server_prompts.py" = ["B008", "TC002", "PLR0913"]
# pytest fixtures need runtime imports; Path used in signatures needs to be importable at runtime.
"tests/*.py" = ["ARG001", "ARG002", "TC001", "TC002", "TC003"]
# PROJECT-RUFF-IGNORES-END

[tool.ruff.lint.isort]
known-first-party = ["scholar_mcp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


# Structural-gate thresholds. These rules are NOT in the whole-repo `select`
# above — they apply only on the diff via the structural gate's
# `--extend-select` (see .pre-commit-config.yaml / ci.yml). Values are ruff
# defaults, surfaced here as editable policy constants.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra", "-m", "not live"]
asyncio_mode = "auto"
log_level = "WARNING"
markers = [
    "live: tests that hit real network services; opt-in via `pytest -m live`",
    "browser: end-to-end test that drives a headless browser (requires the 'browser' dependency group + 'playwright install chromium')",
]

[tool.coverage.run]
source = ["src/scholar_mcp"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.$",
    "class .*\\bProtocol\\):",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["fastmcp", "fastmcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["epo_ops", "epo_ops.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["requests", "requests.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional browser-test dep; only installed in the `browser` dependency group.
module = ["playwright", "playwright.*"]
ignore_missing_imports = true

# Tests use pytest idioms (untyped fixtures, monkey-patching, ad-hoc stubs,
# TypedDict literals passed as dicts) that don't pay back when forced into
# strict annotation. Keep mypy running over tests/ so import-time failures
# still surface, but relax the checks that produce no signal in test code.
# Incremental re-tightening tracked in #167.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_unused_ignores = false
disable_error_code = [
    "arg-type",
    "attr-defined",
    "comparison-overlap",
    "func-returns-value",
    "index",
    "list-item",
    "method-assign",
    "misc",
    "no-any-return",
    "type-arg",
    "union-attr",
    "var-annotated",
]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pyright]
# Point Pyright at the uv-managed venv so editor diagnostics resolve
# imports the same way as our CLI tools (mypy/ruff/pytest run via uv).
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
# src-layout editable installs use a .pth shim that Pyright does not execute;
# point Pyright at src/ directly so IDE import resolution matches runtime.
extraPaths = ["src"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "angular"
tag_format = "v{version}"
